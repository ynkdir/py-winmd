# Every commit: run both suites, which means building the C++ reader and
# checking this one against it over the real metadata.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Layout and lint do not vary by platform or by Python, so they run once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: ruff
        run: |
          python -m pip install "ruff>=0.16"
          ruff format --check
          ruff check

  test:
    strategy:
      fail-fast: false
      matrix:
        # Every Python the package claims, on both platforms. The reference is
        # built with g++ on Linux and MSVC on Windows, so this reader is
        # compared against a build from each compiler.
        os: ["ubuntu-latest", "windows-latest"]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} python ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The metadata and the C++ reader are in the tree, under vendor/, so
      # there is nothing to fetch: scripts/fetch-vendor.ps1 is for refreshing
      # them, not for running the tests.
      - name: test
        run: python -m unittest discover -s tests -v

      # The package is what gets published, so building it is part of the check.
      - name: build
        run: |
          python -m pip install build
          python -m build
