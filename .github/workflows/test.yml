# Every commit: run both suites, which means building the C++ reader and
# checking this one against it over the real metadata.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every Python the package claims, on both platforms. The reference is
        # built with g++ on Linux and MSVC on Windows, so both readers are
        # compared against both compilers, and Windows also has the system
        # WinMetadata to read.
        os: ["ubuntu-latest", "windows-latest"]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} python ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The metadata and the C++ reader are in the tree, under vendor/, so
      # there is nothing to fetch: scripts/fetch-vendor.ps1 is for refreshing
      # them, not for running the tests.
      - name: test
        run: python -m unittest discover -s tests -v

      # The package is what gets published, so building it is part of the check.
      - name: build
        run: |
          python -m pip install build
          python -m build
