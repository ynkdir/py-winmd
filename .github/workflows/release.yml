# Builds what a release carries. The reader is pure Python, so that is one
# sdist and one wheel that fits every platform and every supported Python.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: python -m pip install build
      - run: python -m build

      # The tests read real metadata, and check the reader against the C++ one
      # it was written from, so this says the artifacts work before they are
      # attached to anything.
      - name: test what was built
        run: |
          python -m pip install dist/*.whl
          python fetch-metadata.py --headers
          python -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  upload:
    # Only a release has something to attach the files to.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
