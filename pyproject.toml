[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "winmd"
version = "2.0.0"
description = "A reader for Windows Metadata (.winmd), in the standard library alone"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/ynkdir/py-winmd"
Documentation = "https://github.com/ynkdir/py-winmd#readme"
Source = "https://github.com/ynkdir/py-winmd"
Issues = "https://github.com/ynkdir/py-winmd/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["winmd"]

[tool.setuptools.package-data]
winmd = ["py.typed"]
