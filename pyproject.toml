[build-system]
requires = ["meson-python", "meson>=1.0.0", "ninja"]
build-backend = "mesonpy"

[project]
name = "winmd"
version = "1.0.0"
description = "Python bindings for the Microsoft.Windows.WinMD C++ metadata parsing library"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
# Only needed to regenerate the type stubs:
#   python -m nanobind.stubgen -m winmd._winmd -r -O python/winmd -M python/winmd/py.typed
stubs = ["nanobind>=2.0"]
