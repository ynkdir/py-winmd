[project]
name = "winmd"
version = "2.0.0"
description = "Python winmd parser"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/ynkdir/py-winmd"
Documentation = "https://github.com/ynkdir/py-winmd#readme"
Source = "https://github.com/ynkdir/py-winmd"
Issues = "https://github.com/ynkdir/py-winmd/issues"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = [
    "src/*.py*",
    "src/*.ipynb",
]
