[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "winmd"
version = "2.0.0"
description = "A reader for Windows Metadata (.winmd), in the standard library alone"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/ynkdir/py-winmd"
Documentation = "https://github.com/ynkdir/py-winmd#readme"
Source = "https://github.com/ynkdir/py-winmd"
Issues = "https://github.com/ynkdir/py-winmd/issues"

# src/winmd is where the backend looks by default, so it needs telling nothing.
