[project]
name = "winmd"
version = "2.3.0"
description = "Python winmd parser"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/ynkdir/py-winmd"
Documentation = "https://github.com/ynkdir/py-winmd#readme"
Source = "https://github.com/ynkdir/py-winmd"
Issues = "https://github.com/ynkdir/py-winmd/issues"

[dependency-groups]
dev = ["ruff>=0.16", "pyrefly>=1.1"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = [
    "src/**/*.py",
    "tests/**/*.py",
]
# The tests put these on sys.path themselves. examples/ is on the search
# path so that test_examples.py can import what it runs, but is not checked:
# those programs build their ctypes and COM classes with type() while they
# read the metadata, which no checker can follow. Running them is the check.
search-path = ["src", "tests", "examples"]

[tool.ruff]
# ruff's own width. The tables and the names in them come from the
# standard and are long: HasCustomAttribute.GenericParamConstraint beside
# the table it names does not fit in 79, and wrapping one mapping over two
# lines reads worse than the eight columns.
line-length = 88
# No target-version: ruff reads requires-python above and gets 3.11 from it.
# The examples in README.md are laid out to be read, not to be run
# through a formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Stated rather than left to the default, which does not include E501 -
# the drift this was brought in for - and does include UP037, which would
# unquote the annotations that are quoted so a method does not shadow the
# class it returns. RUF100 is back from the default: a noqa that has
# stopped applying should go.
select = ["E", "F", "W", "I", "RUF100"]
