[build-system]
requires = ["meson-python", "meson>=1.3.0", "ninja"]
build-backend = "mesonpy"

[tool.meson-python]
# The extension targets the stable ABI (see limited_api in meson.build), so the
# wheel is tagged abi3 and one build serves every Python from 3.12 on.
limited-api = true

[project]
name = "winmd"
version = "1.0.2"
description = "Python bindings for the Microsoft.Windows.WinMD C++ metadata parsing library"
readme = "README.md"
requires-python = ">=3.12"  # the stable ABI nanobind targets starts there
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
# Only needed to regenerate the type stubs:
#   python -m nanobind.stubgen -m winmd._winmd -r -O python/winmd -M python/winmd/py.typed
stubs = ["nanobind>=2.0"]
